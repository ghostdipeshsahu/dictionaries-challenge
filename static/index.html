<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dictionaries: The Python Challenge</title>
<meta name="description" content="A 45-minute gamified mission on Python dictionaries: the canteen price board.">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/static/css/arena.css">
<link rel="stylesheet" href="/static/css/dicts.css">
</head>
<body class="dicts-app">
<a class="skip" href="#view">Skip to the challenge</a>
<header class="top">
  <div class="wrap">
    <button class="brand" id="homeBtn" type="button" aria-label="Back to the mission map">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#006DAF"/><path d="M5 11.2h9.6l3.6 4.8-3.6 4.8H5z" fill="none" stroke="#47C1EE" stroke-width="2.3" stroke-linejoin="round"/><circle cx="8.6" cy="16" r="1.5" fill="#47C1EE"/><rect x="20.4" y="11.2" width="6.6" height="9.6" rx="2" fill="#F5B523"/></svg>
      <span>Dictionaries</span>
    </button>
    <div class="stat xp" title="Experience points"><svg class="i" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><b id="xpNum">0</b><small>XP</small></div>
    <div class="stat streak" id="comboStat" title="Correct answers in a row"><svg class="i" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4-1-6 1-9z"/></svg><b id="comboNum">0</b><span class="mult">combo</span></div>
    <div class="stat clock" id="clock" title="Mission time left" role="timer" hidden><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><b id="clockNum">45:00</b><small>left</small></div>
    <button class="iconbtn" id="guideBtn" type="button" aria-label="Open the field guide (dictionary cheatsheet)" title="Field guide"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6"/></svg></button>
    <button class="userchip" id="userChip" type="button" hidden></button>
    <button class="iconbtn" id="soundBtn" type="button" aria-pressed="true" aria-label="Sound on"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path id="waves" d="M16 9a4 4 0 0 1 0 6m2.5-9a8 8 0 0 1 0 12"/></svg></button>
  </div>
  <div class="mprog" aria-hidden="true"><i id="mprog"></i></div>
</header>
<main id="view" class="wrap" tabindex="-1"><p class="loading">Loading your mission…</p></main>
<div class="drawer" id="drawer" role="region" aria-live="polite" aria-label="Feedback"></div>
<dialog id="guide" class="guide" aria-labelledby="guideTitle"></dialog>
<dialog id="modal" class="guide modal" aria-labelledby="modalTitle"></dialog>
<canvas id="fx" aria-hidden="true"></canvas>
<script src="/static/js/api.js"></script>
<script src="/static/js/dicts.js"></script>
</body>
</html>
